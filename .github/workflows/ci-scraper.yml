name: CI Scraper

on:
  push:
    branches:
      - main
      - develops
      - "scraper-*"
  pull_request:
    branches:
      - main
      - "scraper-*"

jobs:
  test-and-security-scraper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Test Scraper
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: apps/scraper/go.sum
      - name: Test scraper
        run: |
          cd apps/scraper
          go mod tidy
          go test ./...

      # Go Security Scan (code statique)
      - name: Go Security Scan (scraper)
        run: |
          bash .github/scripts/install-gosec.sh
          cd apps/scraper
          "$(go env GOPATH)/bin/gosec" ./...

      # Secrets Scan
      - name: Find secrets (scraper)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Docker Scan (Trivy)
      - name: Scan Docker images (scraper)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "apps/scraper"
          format: "table"
