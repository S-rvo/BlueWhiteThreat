name: CI Classifier

on:
  push:
    branches: [main, develops]
    paths:
      - 'apps/classifier/**'
      - '.github/workflows/ci-classifier.yml'
  pull_request:
    paths:
      - 'apps/classifier/**'
      - '.github/workflows/ci-classifier.yml'

permissions:
  contents: read

jobs:
  classifier:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/classifier
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/classifier/go.mod
          cache-dependency-path: apps/classifier/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/classifier/requirements-test.txt
      - name: Go tests and static checks
        run: |
          go test ./cmd/... ./internal/...
          go vet ./cmd/... ./internal/...
      - name: Install Python test dependencies
        run: python3 -m pip install -r requirements-test.txt
      - name: Offline annotation and evaluation contract tests
        run: python3 -B -m unittest discover -s scripts -p 'test_*.py'
      - name: Archived experiment checks
        run: |
          go test ./experiments/...
          go vet ./experiments/...
          PYTHONPATH=scripts python3 -B -m unittest discover -s experiments/annotations -p 'test_*.py'
          PYTHONPATH=scripts python3 -B -m unittest discover -s experiments/python -p 'test_*.py'
