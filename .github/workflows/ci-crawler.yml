name: CI Crawler

on:
  push:
    branches:
      - main
      - develop
      - "release/**"
      - "crawler-*"
  pull_request:
    branches:
      - main
      - develop
      - "release/**"
      - "crawler-*"

jobs:
  test-and-security-crawler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Test Crawler
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: apps/crawler/go.sum
      - name: Test crawler
        run: |
          cd apps/crawler
          go mod tidy
          go test ./...
      - name: Test du rapport de couverture
        run: python3 -B -m unittest discover -s apps/crawler/scripts

      # Go Security Scan (code statique)
      - name: Go Security Scan (crawler)
        run: |
          bash .github/scripts/install-gosec.sh
          cd apps/crawler
          "$(go env GOPATH)/bin/gosec" ./...

      # Secrets Scan
      - name: Find secrets (crawler)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Docker Scan (Trivy)
      - name: Scan Docker images (crawler)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "apps/crawler"
          format: "table"
