x-crawler-runtime: &crawler-runtime
  build:
    context: .
    dockerfile: apps/crawler/Dockerfile.prd
  init: true
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  depends_on:
    - redis
    - neo4j
  environment:
    - REDIS_HOST=redis
    - REDIS_PORT=6379
    - NEO4J_URI=bolt://neo4j:7687
    - NEO4J_USER=neo4j
    - NEO4J_PASSWORD=${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in the root .env}
  restart: unless-stopped

services:
  tor1:
    networks: [default, crawl-proxy]
    build:
      context: ./apps/proxy
      dockerfile: Dockerfile.dev
    container_name: tor_proxy_1
    ports:
      - "127.0.0.1:9051:9050"
    tty: true
    stdin_open: true
    restart: unless-stopped

  tor2:
    networks: [default, crawl-proxy]
    build:
      context: ./apps/proxy
      dockerfile: Dockerfile.dev
    container_name: tor_proxy_2
    ports:
      - "127.0.0.1:9052:9050"
    tty: true
    stdin_open: true
    restart: unless-stopped

  tor3:
    networks: [default, crawl-proxy]
    build:
      context: ./apps/proxy
      dockerfile: Dockerfile.dev
    container_name: tor_proxy_3
    ports:
      - "127.0.0.1:9053:9050"
    tty: true
    stdin_open: true
    restart: unless-stopped

  crawler:
    <<: *crawler-runtime
    container_name: crawler_service

  # Shared frontiers and token leases make horizontal replicas safe.
  crawler2:
    <<: *crawler-runtime
    container_name: crawler_service_2

  crawler3:
    <<: *crawler-runtime
    container_name: crawler_service_3

  # Scheduling réel pour l'approvisionnement en seeds (point 3 du plan de
  # fraîcheur) : désactivé par défaut (profile dédié), à lancer explicitement
  # avec `docker compose --profile seeds up collectseeds`. Tourne en boucle
  # bornée (une collecte quotidienne, intervalle explicite ci-dessous)
  # plutôt qu'un service toujours actif par défaut.
  collectseeds:
    build:
      context: .
      dockerfile: apps/crawler/Dockerfile.dev
    container_name: collectseeds_service
    profiles:
      - seeds
    command: ["go", "run", "./cmd/collectseeds", "-loop", "-interval=24h"]
    volumes:
      - .:/app
    depends_on:
      - redis
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - ONION_SEARCH_API_KEY=${ONION_SEARCH_API_KEY:-}
    restart: unless-stopped

  # Alerting léger (sans Prometheus/Grafana) : vérifie périodiquement
  # queue_size/oldest_crawled_age_seconds et notifie un webhook en cas de
  # dérive. Opt-in (profile dédié) ; sans ALERT_WEBHOOK_URL il logue
  # seulement, utile pour tester sans configurer de webhook.
  alerting:
    build:
      context: .
      dockerfile: apps/crawler/Dockerfile.dev
    container_name: alerting_service
    profiles:
      - alerting
    command: ["go", "run", "./cmd/alerting", "-loop"]
    volumes:
      - .:/app
    depends_on:
      - redis
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - ALERT_WEBHOOK_URL=${ALERT_WEBHOOK_URL:-}
    restart: unless-stopped

  redis:
    networks: [default, scraper-data]
    image: redis:8.0-rc1-alpine
    container_name: redis_service
    # AOF (appendfsync everysec) en plus des snapshots RDB : la frontière est
    # la source de vérité durable du crawler ; sans AOF, un crash perd jusqu'à
    # une heure de file (fenêtre RDB `save 3600 1`). everysec borne la perte à
    # ~1s tout en gardant un débit correct. RDB reste actif pour les restore
    # rapides et les backups ponctuels.
    #
    # rename-command "" neutralise FLUSHALL/FLUSHDB : le crawler n'en a jamais
    # besoin, et l'AOF n'offre AUCUNE protection contre un wipe logique (un
    # flush est appendé comme toute commande). Ferme au niveau serveur la
    # classe d'incident du 2026-11-10 (suppression accidentelle de la file).
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--rename-command", "FLUSHALL", "", "--rename-command", "FLUSHDB", "", "--aclfile", "/usr/local/etc/redis/users.acl"]
    volumes:
      - ./db/redis:/data
      - ./ops/redis/users.acl:/usr/local/etc/redis/users.acl:ro
    ports:
      - "127.0.0.1:6379:6379"
    restart: unless-stopped

  # Snapshots RDB rotés hors du volume de travail : seule défense permettant un
  # restore point-in-time AVANT une suppression logique ou une panne du disque
  # hôte (AOF/RDB du volume vivent et meurent avec lui). `redis-cli --rdb`
  # demande un dump cohérent au serveur sans toucher /data. Garde 14 jours.
  redis-backup:
    image: redis:8.0-rc1-alpine
    container_name: redis_backup
    init: true
    volumes:
      - "${BWT_REDIS_BACKUP_PATH:-./db/redis-backups}:/backups"
      - ./apps/crawler/scripts/redis-backup.sh:/usr/local/bin/bwt-redis-backup.sh:ro
    depends_on:
      - redis
    entrypoint: ["sh", "/usr/local/bin/bwt-redis-backup.sh"]
    command: []
    healthcheck:
      test: ["CMD", "sh", "/usr/local/bin/bwt-redis-backup.sh", "--check"]
      interval: 5m
      start_period: 5m
      start_interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  scraper:
    networks: [crawl-proxy, scraper-data, scrape-observe]
    build:
      context: .
      dockerfile: apps/scraper/Dockerfile.prd
    container_name: scraper_service
    init: true
    pids_limit: 1024
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
      - seccomp=./ops/scraper/seccomp.json
    tmpfs:
      - /tmp:rw,nosuid,nodev,mode=1777,size=256m
    shm_size: 256m
    depends_on:
      - mongodb
      - redis
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MONGO_HOST=mongodb
      - SCRAPER_REQUIRE_SANDBOX=1
    env_file:
      - ./apps/scraper/.env
      - ./apps/scraper/.credentials.env
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "/usr/local/bin/scraper", "--check-health"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  classifier:
    build:
      context: ./apps/classifier
      dockerfile: Dockerfile.dev
    container_name: classifier_service
    volumes:
      - ./apps/classifier:/app
    depends_on:
      - mongodb
    env_file:
      - ./apps/classifier/.env

  # Production NLP: direct read-only directory mount keeps model replacements
  # visible. The service reloads MODEL_PATH every CLASSIFIER_INTERVAL_MIN.
  classifier-prd:
    build:
      context: ./apps/classifier
      dockerfile: Dockerfile.prd
    container_name: classifier_prd_service
    volumes:
      - ./apps/classifier:/data:ro
    environment:
      - MODEL_PATH=/data/model.json
    depends_on:
      - mongodb
    env_file:
      - ./apps/classifier/.env
    restart: unless-stopped

  front:
    build:
      context: ./apps/front
      dockerfile: Dockerfile.dev
    container_name: frontend
    depends_on:
      - scraper
    volumes:
      - ./apps/front:/app
      - /app/node_modules
    ports:
      - "127.0.0.1:8080:8080"

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.dev
    container_name: api_service
    depends_on:
      - mongodb
      - neo4j
    environment:
      # Lecture seule côté code (sessions READ) ; /graph répond 503 sans Neo4j.
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-}
    volumes:
      - ./apps/api:/app
    ports:
      - "127.0.0.1:8083:8083"
    profiles: ["api"]
    env_file:
      - path: ./apps/api/.env
        required: false

  mongodb:
    networks: [default, scraper-data]
    image: mongo:8.0.9
    container_name: mongodb_service
    ports:
      - "127.0.0.1:27017:27017"
    env_file:
      - ./apps/scraper/.env
    volumes:
      - mongodb_data:/data/db

  neo4j:
    image: neo4j:5.19
    container_name: neo4j_service
    ports:
      - "127.0.0.1:7474:7474" # Interface web Neo4j Browser
      - "127.0.0.1:7687:7687" # Connexion Bolt
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in the root .env}
      - NEO4J_dbms_security_auth__enabled=true
    volumes:
      - neo4j_data:/data
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: ollama_service
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  parser:
    build:
      context: ./apps/parser
      dockerfile: Dockerfile.dev
    container_name: parser_service
    volumes:
      - ./apps/parser:/app
    depends_on:
      - mongodb
      - neo4j
      - ollama
    environment:
      - MONGO_HOST=mongodb
      - MONGO_PORT=27017
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in the root .env}
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_MODEL=qwen2.5:14b-instruct
      - PARSER_INTERVAL_MIN=10
      - PARSER_ENABLE_REMOTE_FALLBACK=${PARSER_ENABLE_REMOTE_FALLBACK:-false}
    env_file:
      - ./apps/scraper/.env

volumes:
  mongodb_data:
  redis_data:
  neo4j_data:
  ollama_data:

# The scraper reaches its state stores, Tor SOCKS and monitoring on separate
# internal networks; it does not join the general application network.
networks:
  crawl-proxy:
    internal: true
  scraper-data:
    internal: true
  scrape-observe:
    internal: true
