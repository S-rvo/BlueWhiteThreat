services:
  tor1:
    build:
      context: ./apps/proxy
      dockerfile: Dockerfile.dev
    container_name: tor_proxy_1
    ports:
      - "9051:9050"
    tty: true
    stdin_open: true
    restart: unless-stopped

  tor2:
    build:
      context: ./apps/proxy
      dockerfile: Dockerfile.dev
    container_name: tor_proxy_2
    ports:
      - "9052:9050"
    tty: true
    stdin_open: true
    restart: unless-stopped

  tor3:
    build:
      context: ./apps/proxy
      dockerfile: Dockerfile.dev
    container_name: tor_proxy_3
    ports:
      - "9053:9050"
    tty: true
    stdin_open: true
    restart: unless-stopped

  crawler:
    build:
      context: .
      dockerfile: apps/crawler/Dockerfile.dev
    container_name: crawler_service
    volumes:
      - .:/app
    depends_on:
      - redis
      - neo4j
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password
    restart: unless-stopped

  # Réplicas additionnels pour le scaling horizontal : GetNextURLFromQueue
  # dépile Redis de façon atomique, donc plusieurs process peuvent consommer
  # la même file sans collision ni changement de code. Toujours gratés dans
  # les 3 mêmes proxys Tor (tor1-3) -- ne pas ajouter de nouveaux conteneurs
  # tor4/tor5 sans vérifier d'abord que ces 3 là sont bien le goulot
  # d'étranglement réel (un conteneur Tor sert déjà plusieurs connexions
  # simultanées), plutôt que de les ajouter par réflexe.
  crawler2:
    build:
      context: .
      dockerfile: apps/crawler/Dockerfile.dev
    container_name: crawler_service_2
    volumes:
      - .:/app
    depends_on:
      - redis
      - neo4j
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password
    restart: unless-stopped

  crawler3:
    build:
      context: .
      dockerfile: apps/crawler/Dockerfile.dev
    container_name: crawler_service_3
    volumes:
      - .:/app
    depends_on:
      - redis
      - neo4j
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password
    restart: unless-stopped

  # Scheduling réel pour l'approvisionnement en seeds (point 3 du plan de
  # fraîcheur) : désactivé par défaut (profile dédié), à lancer explicitement
  # avec `docker compose --profile seeds up collectseeds`. Tourne en boucle
  # bornée (une collecte hebdomadaire, voir loopInterval dans cmd/collectseeds)
  # plutôt qu'un service toujours actif par défaut.
  collectseeds:
    build:
      context: .
      dockerfile: apps/crawler/Dockerfile.dev
    container_name: collectseeds_service
    profiles:
      - seeds
    command: ["go", "run", "./cmd/collectseeds", "-loop"]
    volumes:
      - .:/app
    depends_on:
      - redis
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    restart: unless-stopped

  # Alerting léger (sans Prometheus/Grafana) : vérifie périodiquement
  # queue_size/oldest_crawled_age_seconds et notifie un webhook en cas de
  # dérive. Opt-in (profile dédié) ; sans ALERT_WEBHOOK_URL il logue
  # seulement, utile pour tester sans configurer de webhook.
  alerting:
    build:
      context: .
      dockerfile: apps/crawler/Dockerfile.dev
    container_name: alerting_service
    profiles:
      - alerting
    command: ["go", "run", "./cmd/alerting", "-loop"]
    volumes:
      - .:/app
    depends_on:
      - redis
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - ALERT_WEBHOOK_URL=${ALERT_WEBHOOK_URL:-}
    restart: unless-stopped

  redis:
    image: redis:8.0-rc1-alpine
    container_name: redis_service
    volumes:
      - ./db/redis:/data
    ports:
      - "6379:6379"
    restart: unless-stopped

  scraper:
    build:
      context: .
      dockerfile: apps/scraper/Dockerfile.dev
    container_name: scraper_service
    init: true
    pids_limit: 1024
    volumes:
      - .:/app
    depends_on:
      - mongodb
      - redis
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MONGO_HOST=mongodb
    env_file:
      - ./apps/scraper/.env
      - ./apps/scraper/.credentials.env
    restart: unless-stopped

  classifier:
    build:
      context: ./apps/classifier
      dockerfile: Dockerfile.dev
    container_name: classifier_service
    volumes:
      - ./apps/classifier:/app
    depends_on:
      - mongodb
    env_file:
      - ./apps/classifier/.env

  # Production NLP: direct read-only directory mount keeps model replacements
  # visible. The service reloads MODEL_PATH every CLASSIFIER_INTERVAL_MIN.
  classifier-prd:
    build:
      context: ./apps/classifier
      dockerfile: Dockerfile.prd
    container_name: classifier_prd_service
    volumes:
      - ./apps/classifier:/data:ro
    environment:
      - MODEL_PATH=/data/model.json
    depends_on:
      - mongodb
    env_file:
      - ./apps/classifier/.env
    restart: unless-stopped

  front:
    build:
      context: ./apps/front
      dockerfile: Dockerfile.dev
    container_name: frontend
    depends_on:
      - scraper
    volumes:
      - ./apps/front:/app
      - /app/node_modules
    ports:
      - "8080:8080"

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.dev
    container_name: api_service
    depends_on:
      - mongodb
    volumes:
      - ./apps/api:/app
    ports:
      - "8083:8083"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017

  mongodb:
    image: mongo:8.0.9
    container_name: mongodb_service
    ports:
      - "27017:27017"
    env_file:
      - ./apps/scraper/.env
    volumes:
      - mongodb_data:/data/db

  mongo-express:
    image: mongo-express:1.0.2-20-alpine3.19
    container_name: mongo_express
    ports:
      - "8082:8082"
    env_file:
      - ./apps/scraper/.env
    environment:
      - ME_CONFIG_MONGODB_ADMINUSERNAME=root
      - ME_CONFIG_MONGODB_ADMINPASSWORD=root
      - ME_CONFIG_MONGODB_SERVER=mongodb
      - ME_CONFIG_BASICAUTH_USERNAME=user
      - ME_CONFIG_BASICAUTH_PASSWORD=user
    depends_on:
      - mongodb

  neo4j:
    image: neo4j:5.19
    container_name: neo4j_service
    ports:
      - "7474:7474" # Interface web Neo4j Browser
      - "7687:7687" # Connexion Bolt
    environment:
      - NEO4J_AUTH=neo4j/password
      - NEO4J_dbms_security_auth__enabled=true
    volumes:
      - neo4j_data:/data
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: ollama_service
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  parser:
    build:
      context: ./apps/parser
      dockerfile: Dockerfile.dev
    container_name: parser_service
    volumes:
      - ./apps/parser:/app
    depends_on:
      - mongodb
      - neo4j
      - ollama
    environment:
      - MONGO_HOST=mongodb
      - MONGO_PORT=27017
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_MODEL=qwen2.5:14b-instruct
      - PARSER_INTERVAL_MIN=10
    env_file:
      - ./apps/scraper/.env

volumes:
  mongodb_data:
  redis_data:
  neo4j_data:
  ollama_data:
